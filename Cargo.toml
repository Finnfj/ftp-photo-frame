[package]
name = "syno-photo-frame"
version = "0.18.2"
edition = "2024"
description = "Full-screen slideshow for Synology Photos and Immich albums, and for FTP servers"
license = "GPL-3.0-or-later"
authors = ["Piotr Karasinski"]
readme = "README.md"
repository = "https://github.com/caleb9/syno-photo-frame"
keywords = [
    "synology",
    "synology-photos",
    "immich",
    "digital-photo-frame",
    "raspberry-pi",
]
rust-version = "1.88"
exclude = [
    ".*",
    "doc/",
    "Dockerfile",
    "dpkg/",
    "assets/*.xcf"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
# FTPS support for the FTP backend, i.e. ftps:// share links
ftps = ["dep:rustls", "dep:rustls-platform-verifier", "suppaftp/rustls-aws-lc-rs"]
# Support for a motion sensor switching the display off, see --motion-sensor-gpio
motion-sensor = ["dep:rppal"]

[dependencies]
anyhow = "1.*"
bytes = "1.*"
clap = { version = "4.*", features = ["derive", "wrap_help"] }
chrono = { version = "0.4.*", features = ["serde", "unstable-locales"] }
fast_image_resize = { version = "5.*", features = ["image"] }
image = { version = "0.25.*", default-features = false, features = ["jpeg", "png"] }
log = "0.4.*"
rand = "0.10.*"
regex = "1.*"
reqwest = { version = "0.13.*", features = ["blocking", "cookies", "json", "form", "query"] }
rustls = { version = "0.23.*", optional = true, features = ["aws-lc-rs"] }
rustls-platform-verifier = { version = "0.7.*", optional = true }
sdl2 = { version = "0.38.*", features = ["gfx", "ttf"] }
serde = { version = "1.*", features = ["derive"] }
serde_json = "1.*"
simple_logger = "5.*"
syno_api = "0.6"
suppaftp = { version = "10", default-features = false }
percent-encoding = "2.3.2"
kamadak-exif = "0.6.1"

# Raspberry Pi GPIO access, needed by the optional motion sensor support
[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.22.*", optional = true }

[dev-dependencies]
mock_instant = "0.6.*"
mockall = "0.15.*"
