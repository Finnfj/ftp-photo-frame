name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends \
            cmake libsdl2-dev libsdl2-gfx-dev libsdl2-ttf-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # Scoped to this invocation rather than set through RUSTFLAGS, which would also deny warnings
      # in dependencies and invalidate the cache
      - run: cargo clippy --locked --all-targets --all-features -- --deny warnings

      # Every check above passes --all-features, so nothing here would ever compile the
      # #[cfg(not(feature = "web"))] arms -- and the default feature set is exactly what the
      # Debian package ships, since dpkg/Makefile runs a bare `cargo build --release`.
      - run: cargo clippy --locked --all-targets -- --deny warnings

      - run: cargo test --locked --all-features

  build:
    name: Release binary for aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built inside docker/Dockerfile's image, which is based on the same Debian release as
      # Raspberry Pi OS. The script fails the build if the result needs a newer glibc than the
      # device has -- the one thing this job could not previously notice, because it builds the
      # binary and never runs it.
      #
      # No QEMU and no cross: the image installs plain arm64 library packages, whose maintainer
      # scripts do not execute target binaries.
      - run: bash scripts/build-aarch64.sh

      - uses: actions/upload-artifact@v4
        with:
          name: syno-photo-frame-aarch64
          path: target/aarch64-unknown-linux-gnu/release/syno-photo-frame
          if-no-files-found: error
          retention-days: 14
